[package]
name = "nestbox"
version = "1.0.0"
description = "Nestbox – virtuelle Maschinen einfach gemacht"
authors = ["Morni"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nestbox_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
elevated-command = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Entwicklungs-Build ohne Debug-Symbole: spart mehrere GB Plattenplatz
[profile.dev]
debug = false
incremental = false

[profile.dev.package."*"]
debug = false
