# Prüft bei jedem Push, ob Oberfläche (TypeScript) und Backend (Rust) fehlerfrei kompilieren.
# Läuft auf GitHub, damit lokal kein mehrere GB großer Rust-Build nötig ist.
name: Prüfen

on:
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**", "fortschritt/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Oberfläche prüfen (TypeScript)
        run: npx tsc -b

      - name: Oberfläche bauen
        run: npx vite build

      - name: Backend prüfen (Rust)
        working-directory: src-tauri
        run: cargo check --all-targets
