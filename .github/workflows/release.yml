# Baut den Windows-Installer und veröffentlicht ihn als GitHub-Release.
# Auslöser: ein Tag wie „v0.9.0“ oder von Hand unter „Actions → Installer bauen → Run workflow“.
# Die Dateien heißen immer gleich (Nestbox-Setup.exe, Nestbox.msi), damit der
# Download-Link …/releases/latest/download/Nestbox-Setup.exe dauerhaft funktioniert.
name: Installer bauen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Installer bauen und signieren
        run: npm run tauri build
        env:
          # Signiert die Update-Pakete; ohne gültige Signatur installiert Nestbox kein Update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Dateien mit festen Namen ablegen und latest.json erzeugen
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem "$bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName out/Nestbox-Setup.exe
          Copy-Item (Get-ChildItem "$bundle/msi/*.msi" | Select-Object -First 1).FullName out/Nestbox.msi

          # latest.json: Hier schaut die installierte App nach, ob es ein Update gibt.
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          $signature = (Get-Content "$($setup.FullName).sig" -Raw).Trim()
          $notes = (Get-Content .github/update-notes.md -Raw -Encoding UTF8).Trim()
          $manifest = [ordered]@{
            version   = $version
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signature
                url       = "https://github.com/${{ github.repository }}/releases/download/$tag/Nestbox-Setup.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content out/latest.json -Encoding utf8NoBOM
          Get-Content out/latest.json
          Get-ChildItem out | Format-Table Name, Length

      - name: Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Nestbox $version (Vorschau)" --notes-file .github/release-notes.md --target $env:GITHUB_SHA
          }
          gh release upload $tag out/Nestbox-Setup.exe out/Nestbox.msi out/latest.json --clobber
